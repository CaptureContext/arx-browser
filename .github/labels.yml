# Kind and state
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "crash"
  color: "8b0000"
  description: "Arx quit or froze"
- name: "enhancement"
  color: "0da6df"
  description: "New feature or request"
- name: "needs triage"
  color: "ededed"
  description: "Not yet read by a maintainer"
- name: "needs info"
  color: "fef2c0"
  description: "Waiting on the reporter: version, steps, a recording or diagnostics"
- name: "needs design"
  color: "f9d0c4"
  description: "Changes what people see; waits for the owner's decision"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "fixed in release"
  color: "0e8a16"
  description: "The fix shipped; the version is in the closing comment"
- name: "agent: fixing"
  color: "bfdadc"
  description: "A maintainer's coding agent is working on a fix"

# Pull requests (not accepted yet; see CONTRIBUTING.md)
- name: "good first issue"
  color: "70a401"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed, usually better to use Discussions"
- name: "ready for review"
  color: "0075ca"
  description: "Proof attached; waiting for a maintainer"
- name: "new dependency"
  color: "d93f0b"
  description: "Adds, removes or moves a dependency"
- name: "engine-build"
  color: "5319e7"
  description: "Added by a maintainer to build the engine for this pull request on the project's own Macs"
