# Labels for the public repository. Synced by .github/workflows/labels.yml on
# every push to main that changes this file. The sync creates and updates;
# it never deletes, so a label a maintainer added by hand stays.

# The repository's first labels, kept as they were set on GitHub
- name: "docs"
  color: "b0d4ff"
  description: "Issue involves adjustments for arx-manual"
- name: "infra"
  color: "ff9a24"
  description: "Change involves infrastructure adjustments"
- name: "ui/ux"
  color: "6950f2"
  description: "Change involves UI/UX update"
- name: "question"
  color: "d876e3"
  description: "Further information is requested, usually better to use Discussions"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

# Severity
- name: "severity: blocker"
  color: "b60205"
  description: "Arx can't be used, data is lost, or it crashes on launch. Fixed before anything else."
- name: "severity: broken"
  color: "d93f0b"
  description: "A feature doesn't work, with no reasonable way around it."
- name: "severity: annoying"
  color: "fbca04"
  description: "Works, but gets in the way, or there is a workaround."
- name: "severity: polish"
  color: "c5def5"
  description: "Small visual or wording detail."

