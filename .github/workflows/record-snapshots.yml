name: Record snapshots
# `/record-snapshots` in a comment on a pull request, from a maintainer (author association OWNER,
# MEMBER or COLLABORATOR), records the snapshot tests' reference images and commits them to the pull
# request's branch (DEV-1281). `/record-snapshots <commit>` records only if the pull request's head
# is still that commit. See DEVELOPMENT.md › Public CI.
#
# Two jobs, so the pull request's code never runs next to anything that can write:
# - record checks out the pull request's head and runs the tests in record mode on GitHub's hosted
#   runner, with a read-only token and no secrets, then uploads the images that changed.
# - commit runs none of the pull request's code. It downloads the images, refuses anything that
#   isn't a PNG under a test target's __Snapshots__ folder, and commits them to the branch. A fork's
#   branch takes the commit only with "Allow edits by maintainers" on, and only through the
#   ARX_SNAPSHOTS_TOKEN secret: the run's own token can't push to a fork.
#
# The tests compare against stored references only once they use assertSnapshot (swift-snapshot-
# testing, which reads SNAPSHOT_TESTING_RECORD). Today's design snapshot tests write PNGs to
# ARX_DESIGN_SNAPSHOTS for a person to look at and store nothing, so this records nothing yet.
on:
  issue_comment:
    types: [created]
permissions: {}
concurrency:
  group: record-snapshots-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  record:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/record-snapshots') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    # The hosted macOS 27 image; see checks.yml.
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pull_request.outputs.head_sha }}
      head_ref: ${{ steps.pull_request.outputs.head_ref }}
      head_repo: ${{ steps.pull_request.outputs.head_repo }}
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - name: Refuse anything but a GitHub-hosted runner
        if: runner.environment != 'github-hosted'
        run: |
          echo "::error::This job runs a pull request's code, so it only runs on GitHub-hosted runners."
          exit 1
      - name: Read the command and the pull request
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          first_line="$(printf '%s\n' "$COMMENT" | head -n 1 | tr -d '\r')"
          read -r command expected extra <<< "$first_line" || true
          if [ "$command" != /record-snapshots ] || [ -n "${extra:-}" ]; then
            echo "::error::The comment's first line must be /record-snapshots, optionally followed by a commit."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/pull_request.json"
          head_sha="$(jq -r .head.sha "$RUNNER_TEMP/pull_request.json")"
          if [ "$(jq -r .state "$RUNNER_TEMP/pull_request.json")" != open ]; then
            echo "::error::The pull request isn't open."
            exit 1
          fi
          if [ -n "${expected:-}" ] && [ "${head_sha#"$expected"}" = "$head_sha" ]; then
            echo "::error::The pull request's head is $head_sha, not $expected."
            exit 1
          fi
          {
            echo "head_sha=$head_sha"
            echo "head_ref=$(jq -r .head.ref "$RUNNER_TEMP/pull_request.json")"
            echo "head_repo=$(jq -r .head.repo.full_name "$RUNNER_TEMP/pull_request.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Check out the pull request's head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pull_request.outputs.head_repo }}
          ref: ${{ steps.pull_request.outputs.head_sha }}
          submodules: recursive
          persist-credentials: false
      # No caches: this run belongs to the default branch, and a cache it saved would be restored
      # by the default branch's own runs.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
      - name: Generate workspace
        run: make bootstrap
      - name: Run the tests in record mode
        # swift-snapshot-testing rewrites the references of the snapshots that don't match and
        # fails those tests, so failures are expected. make test stops at the first failing
        # package, so this runs every package's tests (as make test finds them) to the end.
        env:
          SNAPSHOT_TESTING_RECORD: failed
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: "8"
        run: |
          mkdir -p build/logs
          for manifest in Package.swift Packages/*/Package.swift; do
            package="$(dirname "$manifest")"
            name="$(basename "$(cd "$package" && pwd)")"
            if swift package --package-path "$package" dump-package | jq -e 'any(.targets[]; .type == "test")' > /dev/null; then
              # The same paths make test uses (Scripts/tools/swift.py).
              swift test --package-path "$package" --scratch-path .build --security-path build/swift-security > "build/logs/record-$name.log" 2>&1 \
                || echo "::notice::$package had failing tests (expected where snapshots were recorded); see build/logs/record-$name.log."
            fi
          done
      - name: Collect the recorded images
        id: collect
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/snapshots"
          mkdir -p "$output"
          git ls-files --modified --others --exclude-standard -z -- 'Packages/*/Tests/**/__Snapshots__/**' |
            while IFS= read -r -d '' file; do
              mkdir -p "$output/$(dirname "$file")"
              cp "$file" "$output/$file"
              echo "$file"
            done | tee "$RUNNER_TEMP/recorded.txt"
          if [ -s "$RUNNER_TEMP/recorded.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No snapshot changed."
          fi
      - name: Upload the recorded images
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots/
          if-no-files-found: error
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: record-snapshots-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 7
  commit:
    needs: record
    if: needs.record.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_SHA: ${{ needs.record.outputs.head_sha }}
      HEAD_REF: ${{ needs.record.outputs.head_ref }}
      HEAD_REPO: ${{ needs.record.outputs.head_repo }}
      NUMBER: ${{ github.event.issue.number }}
      REQUESTER: ${{ github.event.comment.user.login }}
    steps:
      - name: Download the recorded images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
      - name: Accept only PNGs under the tests' snapshot folders
        env:
          SNAPSHOTS: ${{ runner.temp }}/snapshots
        run: |
          python3 -I - <<'EOF'
          import os, re, sys
          from pathlib import Path

          root = Path(os.environ["SNAPSHOTS"])
          allowed = re.compile(r"Packages/[A-Za-z0-9._-]+/Tests/(?:[^/\x00-\x1f]+/)*__Snapshots__/[^/\x00-\x1f]+/[^/\x00-\x1f]+\.png")
          problems, total = [], 0
          for path in sorted(root.rglob("*")):
              relative = path.relative_to(root).as_posix()
              if path.is_symlink():
                  problems.append(f"{relative} is a link")
              elif path.is_dir():
                  continue
              elif ".." in relative.split("/") or not allowed.fullmatch(relative):
                  problems.append(f"{relative} isn't a PNG in a test target's __Snapshots__ folder")
              elif path.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  problems.append(f"{relative} isn't a PNG")
              elif path.stat().st_size > 10_000_000:
                  problems.append(f"{relative} is over 10 MB")
              else:
                  total += 1
          if problems or not total:
              print("\n".join(problems) or "No images.", file=sys.stderr)
              sys.exit(1)
          print(f"{total} images")
          EOF
      - name: Check out the pull request's branch, without running anything from it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.record.outputs.head_repo }}
          ref: ${{ needs.record.outputs.head_ref }}
          # A fork's branch needs a token that may push to it; the run's own token can't.
          token: ${{ secrets.ARX_SNAPSHOTS_TOKEN || github.token }}
          path: pull-request
      - name: Commit the images to the branch
        env:
          SNAPSHOTS: ${{ runner.temp }}/snapshots
        working-directory: pull-request
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::$HEAD_REF moved on since the images were recorded; comment /record-snapshots again."
            exit 1
          fi
          # Copy file by file: the branch could hold a link where an image goes, so no part of a
          # destination path may be a link, and only the copied paths are staged.
          python3 -I - <<'EOF'
          import os, shutil, sys
          from pathlib import Path

          source, checkout = Path(os.environ["SNAPSHOTS"]), Path.cwd()
          copied = []
          for image in sorted(path for path in source.rglob("*") if path.is_file()):
              relative = image.relative_to(source)
              destination = checkout / relative
              for part in [*reversed(relative.parents[:-1]), relative]:
                  if (checkout / part).is_symlink():
                      sys.exit(f"{part} is a link on the branch; not writing through it.")
              if destination.exists() and not destination.is_file():
                  sys.exit(f"{relative} isn't a file on the branch.")
              destination.parent.mkdir(parents=True, exist_ok=True)
              if not destination.parent.resolve().is_relative_to(checkout.resolve()):
                  sys.exit(f"{relative} leaves the checkout.")
              shutil.copyfile(image, destination, follow_symlinks=False)
              copied.append(relative.as_posix())
          Path(os.environ["RUNNER_TEMP"], "copied.txt").write_text("\n".join(copied) + "\n")
          EOF
          git add --pathspec-from-file="$RUNNER_TEMP/copied.txt" --
          if git diff --cached --quiet; then
            echo "::notice::The branch already has these images."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "Record snapshots" --message "Requested by @$REQUESTER with /record-snapshots on #$NUMBER."
          git push --quiet origin "HEAD:refs/heads/$HEAD_REF"
      - name: Say what happened
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            body="Recorded the snapshots at ${HEAD_SHA:0:7} and committed them to \`$HEAD_REF\` ([run]($RUN))."
          else
            body="Couldn't commit the recorded snapshots to \`$HEAD_REF\` ([run]($RUN)). For a fork, the pull request needs *Allow edits by maintainers*, and the repository the ARX_SNAPSHOTS_TOKEN secret."
          fi
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
